<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGC Group - Executive Brand, Crisis PR & SOP Advisory</title>
  
  <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-zinc-100 selection:bg-white selection:text-black min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Helper SVG Icon Component wrapper for Lucide Icons
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconNode = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons['HelpCircle']);
          ref.current.appendChild(iconNode);
        }
      }, [name]);
      return <span ref={ref} class={`inline-flex items-center justify-center ${className}`}></span>;
    };

    function App() {
      // Navigation State
      const [activeTab, setActiveTab] = useState('home');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Booking System State
      const [bookingModalOpen, setBookingModalOpen] = useState(false);
      const [bookingStep, setBookingStep] = useState(1);
      const [bookingData, setBookingData] = useState({
        serviceCategory: 'crisis',
        meetingPlatform: 'Zoom',
        date: '',
        time: '10:00 AM',
        timeZone: 'Central Time (CT - St. Louis)',
        fullName: '',
        company: '',
        email: '',
        phone: '',
        urgency: 'Standard',
        briefing: ''
      });
      const [bookingConfirmed, setBookingConfirmed] = useState(false);
      const [generatedMeetingLink, setGeneratedMeetingLink] = useState('');

      // SOP Estimator Calculator State
      const [sopScope, setSopScope] = useState({
        departmentCount: 3,
        processComplexity: 'Medium', // Low, Medium, High
        type: 'revision', // new, revision, full_overhaul
        urgency: 'standard'
      });

      // Toast Notification State
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const triggerToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 4000);
      };

      // Open booking modal with pre-selected service
      const handleOpenBooking = (serviceCat = 'crisis') => {
        setBookingData(prev => ({ ...prev, serviceCategory: serviceCat }));
        setBookingStep(1);
        setBookingConfirmed(false);
        setBookingModalOpen(true);
      };

      // Generate meeting link mockup
      useEffect(() => {
        const randomId = Math.random().toString(36).substring(2, 9);
        if (bookingData.meetingPlatform === 'Zoom') {
          setGeneratedMeetingLink(`https://tgcgroup.zoom.us/j/98${Math.floor(10000000 + Math.random() * 90000000)}`);
        } else if (bookingData.meetingPlatform === 'Google Meet') {
          setGeneratedMeetingLink(`https://meet.google.com/tgc-${randomId}`);
        } else {
          setGeneratedMeetingLink(`https://teams.microsoft.com/l/meetup-join/tgc-${randomId}`);
        }
      }, [bookingData.meetingPlatform]);

      const handleBookingSubmit = (e) => {
        e.preventDefault();
        if (!bookingData.fullName || !bookingData.email || !bookingData.date) {
          triggerToast('Please complete all required fields.', 'error');
          return;
        }
        setBookingConfirmed(true);
        triggerToast('Consultation request successfully confirmed! Confirmation sent to email.');
      };

      // Calculate SOP Timeline & Estimated Investment
      const calculatedEstimate = useMemo(() => {
        let baseHours = sopScope.departmentCount * 18;
        
        if (sopScope.processComplexity === 'High') baseHours *= 1.5;
        if (sopScope.processComplexity === 'Low') baseHours *= 0.75;

        if (sopScope.type === 'new') baseHours *= 1.3;
        if (sopScope.type === 'full_overhaul') baseHours *= 1.6;

        const weeks = Math.max(2, Math.ceil(baseHours / 30));
        const minEst = Math.round((baseHours * 135) / 100) * 100;
        const maxEst = Math.round((minEst * 1.25) / 100) * 100;

        return { hours: Math.round(baseHours), weeks, minEst, maxEst };
      }, [sopScope]);

      return (
        <div class="min-h-screen bg-black text-zinc-100 selection:bg-white selection:text-black flex flex-col antialiased">
          
          {/* Toast Notification */}
          {toast.show && (
            <div class={`fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-4 rounded-none shadow-2xl border transition-all transform duration-300 ${
              toast.type === 'error' ? 'bg-zinc-900 border-red-500/80 text-red-200' : 'bg-zinc-900 border-zinc-700 text-white'
            }`}>
              <Icon name={toast.type === 'error' ? 'AlertTriangle' : 'CheckCircle'} className="w-5 h-5 flex-shrink-0" />
              <span class="text-xs font-semibold uppercase tracking-wider">{toast.message}</span>
            </div>
          )}

          {/* Top Crisis Emergency Bar */}
          <div class="bg-zinc-950 text-zinc-400 text-xs py-2.5 px-4 border-b border-zinc-900 flex flex-wrap justify-between items-center gap-2 tracking-wider uppercase font-medium">
            <div class="flex items-center gap-2">
              <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full bg-white opacity-75"></span>
                <span class="relative inline-flex h-2 w-2 bg-white"></span>
              </span>
              <span class="font-bold text-zinc-200 tracking-widest text-[11px]">24/7 Corporate Crisis Hotline:</span>
              <span class="font-mono font-bold text-white text-xs tracking-tight">+1 (314) 555-CRIS (2747)</span>
            </div>
            <div class="hidden md:flex items-center gap-6 text-[11px] text-zinc-400">
              <span class="flex items-center gap-1.5"><Icon name="MapPin" className="w-3.5 h-3.5 text-zinc-200" /> St. Louis HQ (Central Time)</span>
              <button 
                onClick={() => handleOpenBooking('crisis')} 
                class="text-white font-bold hover:underline flex items-center gap-1 uppercase tracking-wider"
              >
                Immediate Emergency Briefing <Icon name="ArrowRight" className="w-3 h-3" />
              </button>
            </div>
          </div>

          {/* Main Header / Navigation */}
          <header class="sticky top-0 z-40 bg-black/95 backdrop-blur-md border-b border-zinc-900">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              {/* Logo */}
              <div 
                class="flex items-center gap-3 cursor-pointer group"
                onClick={() => setActiveTab('home')}
              >
                <div class="w-10 h-10 bg-white flex items-center justify-center font-bold text-black text-xl tracking-tighter group-hover:bg-zinc-200 transition-colors font-heading">
                  TGC
                </div>
                <div>
                  <div class="text-xl font-bold tracking-wider text-white uppercase flex items-center gap-2 font-heading">
                    TGC GROUP <span class="text-zinc-300 text-[10px] px-1.5 py-0.5 border border-zinc-800 bg-zinc-950 font-mono tracking-widest">STL</span>
                  </div>
                  <p class="text-[9px] text-zinc-500 uppercase tracking-widest font-mono">Crisis PR • Brand • Process SOPs</p>
                </div>
              </div>

              {/* Desktop Nav */}
              <nav class="hidden md:flex items-center gap-8 font-heading">
                <button 
                  onClick={() => setActiveTab('home')}
                  class={`text-xs font-bold uppercase tracking-widest transition-colors ${activeTab === 'home' ? 'text-white border-b-2 border-white py-1' : 'text-zinc-500 hover:text-white'}`}
                >
                  Overview
                </button>
                <button 
                  onClick={() => setActiveTab('services')}
                  class={`text-xs font-bold uppercase tracking-widest transition-colors ${activeTab === 'services' ? 'text-white border-b-2 border-white py-1' : 'text-zinc-500 hover:text-white'}`}
                >
                  Practice Areas
                </button>
                <button 
                  onClick={() => setActiveTab('sop-calculator')}
                  class={`text-xs font-bold uppercase tracking-widest transition-colors flex items-center gap-1.5 ${activeTab === 'sop-calculator' ? 'text-white border-b-2 border-white py-1' : 'text-zinc-500 hover:text-white'}`}
                >
                  <Icon name="Sliders" className="w-3.5 h-3.5 text-zinc-300" />
                  SOP Audit Estimator
                </button>
                <button 
                  onClick={() => setActiveTab('case-studies')}
                  class={`text-xs font-bold uppercase tracking-widest transition-colors ${activeTab === 'case-studies' ? 'text-white border-b-2 border-white py-1' : 'text-zinc-500 hover:text-white'}`}
                >
                  Track Record
                </button>
                <button 
                  onClick={() => setActiveTab('contact')}
                  class={`text-xs font-bold uppercase tracking-widest transition-colors ${activeTab === 'contact' ? 'text-white border-b-2 border-white py-1' : 'text-zinc-500 hover:text-white'}`}
                >
                  St. Louis HQ
                </button>
              </nav>

              {/* Book Action Button */}
              <div class="hidden md:flex items-center gap-3 font-heading">
                <button
                  onClick={() => handleOpenBooking('general')}
                  class="px-5 py-2.5 bg-white hover:bg-zinc-200 text-black font-bold text-xs uppercase tracking-wider transition-all flex items-center gap-2 rounded-none border border-white"
                >
                  <Icon name="Video" className="w-4 h-4" />
                  Book Video Consultation
                </button>
              </div>

              {/* Mobile Menu Toggle */}
              <button 
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                class="md:hidden p-2 rounded-none bg-zinc-950 text-zinc-300 hover:text-white border border-zinc-800"
              >
                <Icon name={mobileMenuOpen ? "X" : "Menu"} className="w-6 h-6" />
              </button>
            </div>

            {/* Mobile Navigation Menu */}
            {mobileMenuOpen && (
              <div class="md:hidden bg-zinc-950 border-b border-zinc-800 px-4 pt-3 pb-6 space-y-3 font-mono text-xs uppercase tracking-wider">
                <button onClick={() => { setActiveTab('home'); setMobileMenuOpen(false); }} class="block w-full text-left py-2 text-zinc-300 hover:text-white font-bold">Overview</button>
                <button onClick={() => { setActiveTab('services'); setMobileMenuOpen(false); }} class="block w-full text-left py-2 text-zinc-300 hover:text-white font-bold">Practice Areas & Services</button>
                <button onClick={() => { setActiveTab('sop-calculator'); setMobileMenuOpen(false); }} class="block w-full text-left py-2 text-zinc-300 hover:text-white font-bold flex items-center gap-2">
                  <Icon name="Sliders" className="w-4 h-4 text-zinc-300" /> SOP Audit Estimator
                </button>
                <button onClick={() => { setActiveTab('case-studies'); setMobileMenuOpen(false); }} class="block w-full text-left py-2 text-zinc-300 hover:text-white font-bold">Track Record & Wins</button>
                <button onClick={() => { setActiveTab('contact'); setMobileMenuOpen(false); }} class="block w-full text-left py-2 text-zinc-300 hover:text-white font-bold">St. Louis HQ & Contact</button>
                <div class="pt-2">
                  <button onClick={() => { setMobileMenuOpen(false); handleOpenBooking('general'); }} class="w-full py-3 bg-white text-black font-bold text-center flex items-center justify-center gap-2 uppercase tracking-wider font-heading">
                    <Icon name="Video" className="w-4 h-4" /> Book Video Consultation
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* MAIN BODY CONTENT */}
          <main class="flex-grow">
            
            {/* TAB 1: HOME / OVERVIEW */}
            {activeTab === 'home' && (
              <div class="space-y-24 pb-20">
                
                {/* Executive Hero */}
                <section class="relative overflow-hidden pt-12 pb-20 lg:pt-24 lg:pb-28 border-b border-zinc-900">
                  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <div class="grid lg:grid-cols-12 gap-12 items-center">
                      
                      <div class="lg:col-span-7 space-y-8">
                        <div class="inline-flex items-center gap-2 px-3 py-1 bg-zinc-950 border border-zinc-800 text-zinc-400 text-xs font-mono uppercase tracking-widest">
                          <Icon name="Building2" className="w-3.5 h-3.5 text-white" />
                          St. Louis Executive Advisory & PR Governance
                        </div>

                        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold text-white tracking-tight leading-[1.05] uppercase font-heading">
                          Navigating Complexity. <br />
                          <span class="text-zinc-500">
                            Architecting Resilience.
                          </span> <br />
                          Elevating Brands.
                        </h1>

                        <p class="text-base text-zinc-400 max-w-2xl leading-relaxed font-normal">
                          TGC Group provides C-suite executives, high-growth enterprises, and institutions with high-stakes crisis PR management, brand positioning architecture, and precision business process & SOP engineering.
                        </p>

                        <div class="pt-2 flex flex-wrap gap-4 items-center font-heading">
                          <button
                            onClick={() => handleOpenBooking('crisis')}
                            class="px-7 py-4 bg-white hover:bg-zinc-200 text-black font-bold text-xs uppercase tracking-widest shadow-2xl flex items-center gap-2 transition-transform active:scale-98 border border-white"
                          >
                            <Icon name="Calendar" className="w-4 h-4" />
                            Schedule Video Consultation
                          </button>

                          <button
                            onClick={() => setActiveTab('services')}
                            class="px-7 py-4 bg-zinc-950 hover:bg-zinc-900 text-zinc-200 border border-zinc-800 font-bold text-xs uppercase tracking-widest transition-colors flex items-center gap-2"
                          >
                            Explore Core Pillars
                            <Icon name="ChevronRight" className="w-4 h-4 text-zinc-400" />
                          </button>
                        </div>

                        {/* Trust Proof Badges */}
                        <div class="pt-8 border-t border-zinc-900 grid grid-cols-3 gap-6">
                          <div>
                            <p class="text-3xl font-bold text-white tracking-tight font-heading">98.4%</p>
                            <p class="text-[11px] text-zinc-500 uppercase tracking-wider font-mono mt-1">Crisis Containment</p>
                          </div>
                          <div>
                            <p class="text-3xl font-bold text-white tracking-tight font-heading">$400M+</p>
                            <p class="text-[11px] text-zinc-500 uppercase tracking-wider font-mono mt-1">Value Protected</p>
                          </div>
                          <div>
                            <p class="text-3xl font-bold text-white tracking-tight font-heading">350+</p>
                            <p class="text-[11px] text-zinc-500 uppercase tracking-wider font-mono mt-1">SOP Manuals Built</p>
                          </div>
                        </div>
                      </div>

                      {/* Right Card: Virtual Meeting Preview */}
                      <div class="lg:col-span-5">
                        <div class="bg-zinc-950 border border-zinc-800 p-6 shadow-2xl relative">
                          <div class="flex items-center justify-between pb-4 border-b border-zinc-800 mb-6 font-mono text-xs text-zinc-500 tracking-wider">
                            <div class="flex items-center gap-1.5">
                              <div class="w-2.5 h-2.5 bg-zinc-700"></div>
                              <div class="w-2.5 h-2.5 bg-zinc-700"></div>
                              <div class="w-2.5 h-2.5 bg-zinc-700"></div>
                            </div>
                            <span>DESK // STL-HQ-VIRTUAL</span>
                          </div>

                          <div class="space-y-4">
                            <div class="p-4 bg-black border border-zinc-800 flex items-start gap-4">
                              <div class="p-3 bg-zinc-900 text-white border border-zinc-800">
                                <Icon name="ShieldAlert" className="w-5 h-5" />
                              </div>
                              <div>
                                <h4 class="text-xs font-bold text-white uppercase tracking-wider font-heading">Crisis PR & Reputation Response</h4>
                                <p class="text-xs text-zinc-400 mt-1 leading-relaxed">24/7 Media triage, executive communications, statement crafting, and corporate risk mitigation.</p>
                              </div>
                            </div>

                            <div class="p-4 bg-black border border-zinc-800 flex items-start gap-4">
                              <div class="p-3 bg-zinc-900 text-white border border-zinc-800">
                                <Icon name="Award" className="w-5 h-5" />
                              </div>
                              <div>
                                <h4 class="text-xs font-bold text-white uppercase tracking-wider font-heading">Brand Advisory & Development</h4>
                                <p class="text-xs text-zinc-400 mt-1 leading-relaxed">Strategic repositioning, brand governance, messaging platforms, and executive presence.</p>
                              </div>
                            </div>
